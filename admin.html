<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>จัดการข้อมูล | PEA LED</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body.admin-page{margin:0;background:#07101d;color:#f3ead7;font-family:Sarabun,sans-serif}.admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#0b1423;border-right:1px solid rgba(212,162,76,.16);padding:22px 16px}.brand{font-family:'Noto Serif Thai',serif;font-weight:800;font-size:18px;margin:4px 8px 30px}.side-link{display:block;padding:11px 12px;color:#b8c0cc;text-decoration:none;border-radius:7px;margin:4px 0}.side-link.active,.side-link:hover{background:rgba(212,162,76,.1);color:#f3ead7}.main{padding:32px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.head h1{font-family:'Noto Serif Thai',serif;margin:0 0 5px}.muted{color:#9da8b8}.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:700}.btn-primary{background:#d4a24c;color:#101010}.btn-secondary{background:#243249;color:#f3ead7}.btn-danger{background:#6b2630;color:#fff}.card{background:#101b2b;border:1px solid rgba(212,162,76,.16);border-radius:10px;padding:20px;margin-bottom:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;white-space:nowrap}th{color:#d4a24c;font-size:13px}td{color:#dce2ea}.actions{display:flex;gap:7px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#101b2b;border:1px solid rgba(212,162,76,.25);border-radius:12px;padding:24px}.modal-card h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:13px;color:#b8c0cc;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:10px;background:#091423;border:1px solid #34435b;color:#fff;border-radius:6px}.check{display:flex;gap:8px;align-items:center;margin-top:12px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.status{margin-bottom:14px;padding:10px;border-radius:6px;display:none}.status.show{display:block}.status.ok{background:#173b2c;color:#c9f7dc}.status.err{background:#4a1e25;color:#ffd9dd}@media(max-width:800px){.admin-shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid rgba(212,162,76,.16)}.main{padding:20px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head>
<body class="admin-page"><div class="admin-shell"><aside class="sidebar"><div class="brand">PEA LED<br>Admin</div><a class="side-link" href="index.html">Dashboard</a><a class="side-link" href="index.html#table-section">แหล่งท่องเที่ยว</a><a class="side-link active" href="admin.html">จัดการข้อมูล</a><button id="logoutBtn" class="btn btn-danger" style="width:100%;margin-top:25px">ออกจากระบบ</button></aside><main class="main"><div class="head"><div><h1>จัดการข้อมูล</h1><div class="muted">โครงการ PEA LED เพื่อแหล่งท่องเที่ยวเชิงวัฒนธรรมไทย</div></div><button id="addBtn" class="btn btn-primary">＋ เพิ่มข้อมูล</button></div><div id="status" class="status"></div><section class="card"><div class="toolbar"><strong>ข้อมูลโครงการ</strong><span id="count" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>ลำดับ</th><th>สถานที่</th><th>จังหวัด</th><th>กฟข.</th><th>ปี</th><th>kWh ลดลง</th><th>จัดการ</th></tr></thead><tbody id="adminBody"></tbody></table></div></section></main></div><div id="modal" class="modal"><div class="modal-card"><h2 id="modalTitle">เพิ่มข้อมูลโครงการ</h2><form id="projectForm"><input type="hidden" id="projectId"><div class="grid"><div class="field"><label>สถานที่ *</label><input id="site" required></div><div class="field"><label>จังหวัด</label><input id="province"></div><div class="field"><label>กฟข. *</label><input id="pea" placeholder="เช่น กฟฉ.1" required></div><div class="field"><label>ปีโครงการ *</label><input id="project_year" type="number" min="2500" max="2700" required></div><div class="field"><label>หน่วยไฟฟ้าลดลง (kWh/ปี)</label><input id="kwh" type="number" step="0.001"></div><div class="field"><label>ค่าไฟฟ้าที่ประหยัด (บาท/ปี)</label><input id="baht" type="number" step="0.001"></div><div class="field"><label>CO₂ ลดลง (tCO₂eq/ปี)</label><input id="co2" type="number" step="0.001"></div></div><label class="check"><input id="star" type="checkbox"> โครงการนำร่อง / แสดงเครื่องหมาย ✦</label><div class="modal-actions"><button type="button" id="cancelBtn" class="btn btn-secondary">ยกเลิก</button><button type="submit" class="btn btn-primary">บันทึกข้อมูล</button></div></form></div></div><script src="admin.js"></script></body></html>
