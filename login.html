<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>เข้าสู่ระบบแอดมิน | PEA LED</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body.auth-page{min-height:100vh;display:grid;place-items:center;background:#07101d}.auth-card{width:min(430px,calc(100% - 32px));background:#101b2b;border:1px solid rgba(212,162,76,.22);padding:32px;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.auth-card h1{margin:0 0 8px;color:#f3ead7;font-family:'Noto Serif Thai',serif}.auth-card p{color:#aeb7c4;margin:0 0 24px}.auth-card label{display:block;color:#d7dde6;font-size:14px;margin:14px 0 7px}.auth-card input{width:100%;box-sizing:border-box;padding:12px;border-radius:7px;border:1px solid #35445b;background:#0a1423;color:#fff}.auth-card button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:7px;background:#d4a24c;color:#111;font-weight:700;cursor:pointer}.auth-card .back{display:block;text-align:center;margin-top:18px;color:#d4a24c;text-decoration:none}.msg{margin-top:14px;padding:10px;border-radius:6px;display:none}.error{display:block;background:#4a1e25;color:#ffd9dd}.ok{display:block;background:#173b2c;color:#c9f7dc}</style></head>
<body class="auth-page"><div class="auth-card"><h1>เข้าสู่ระบบแอดมิน</h1><p>ระบบจัดการข้อมูลโครงการ PEA LED</p><form id="loginForm"><label for="username">ชื่อผู้ใช้</label><input id="username" autocomplete="username" placeholder="Dear หรือ แนน" required><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required><button type="submit">เข้าสู่ระบบ</button></form><div id="msg" class="msg"></div><a class="back" href="index.html">← กลับหน้า Dashboard</a></div><script src="login.js"></script></body></html>
